    <circle cx="880" cy="200" r="1.3" opacity=".75"/><circle cx="960" cy="120" r="1" opacity=".6"/>
    <circle cx="1040" cy="90" r="1.4" opacity=".8"/><circle cx="1120" cy="200" r="1" opacity=".6"/>
    <circle cx="1200" cy="80" r="1.1" opacity=".65"/><circle cx="1280" cy="250" r="1.4" opacity=".8"/>
    <circle cx="1360" cy="300" r="1" opacity=".6"/><circle cx="1440" cy="120" r="1.3" opacity=".8"/>
    <circle cx="1520" cy="220" r="1" opacity=".6"/><circle cx="1560" cy="340" r="1.2" opacity=".7"/>
    <circle cx="60" cy="300" r="1" opacity=".6"/><circle cx="140" cy="380" r="1.3" opacity=".75"/>
