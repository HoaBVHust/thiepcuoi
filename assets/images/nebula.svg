    <circle cx="520" cy="300" r="1" opacity=".6"/><circle cx="600" cy="300" r="1.4" opacity=".8"/>
    <circle cx="680" cy="300" r=".9" opacity=".55"/><circle cx="760" cy="360" r="1.2" opacity=".7"/>
    <circle cx="920" cy="300" r="1" opacity=".6"/><circle cx="1000" cy="460" r="1.3" opacity=".75"/>
    <circle cx="1080" cy="520" r=".9" opacity=".55"/><circle cx="1160" cy="500" r="1.2" opacity=".7"/>
    <circle cx="1240" cy="440" r="1" opacity=".6"/><circle cx="1320" cy="520" r="1.4" opacity=".8"/>
    <circle cx="1420" cy="470" r="1" opacity=".6"/><circle cx="1500" cy="560" r="1.3" opacity=".75"/>
    <circle cx="90" cy="540" r="1.2" opacity=".7"/><circle cx="180" cy="600" r="1" opacity=".6"/>
    <circle cx="280" cy="560" r="1.4" opacity=".8"/><circle cx="370" cy="620" r="1" opacity=".6"/>
    <circle cx="470" cy="620" r="1.2" opacity=".7"/><circle cx="560" cy="700" r="1" opacity=".6"/>
    <circle cx="660" cy="680" r="1.3" opacity=".75"/><circle cx="760" cy="740" r="1" opacity=".6"/>
    <circle cx="860" cy="800" r="1.3" opacity=".75"/><circle cx="880" cy="920" r="1" opacity=".6"/>
    <circle cx="1050" cy="760" r="1.2" opacity=".7"/><circle cx="1140" cy="850" r="1" opacity=".6"/>
    <circle cx="1250" cy="800" r="1.3" opacity=".75"/><circle cx="1350" cy="900" r="1" opacity=".6"/>
    <circle cx="1480" cy="860" r="1.2" opacity=".7"/><circle cx="1540" cy="940" r="1" opacity=".55"/>
    <circle cx="490" cy="760" r="1.1" opacity=".65"/><circle cx="590" cy="820" r="1" opacity=".6"/>
    <circle cx="220" cy="760" r="1.2" opacity=".7"/><circle cx="150" cy="880" r="1" opacity=".6"/>
    <circle cx="80" cy="700" r="1.3" opacity=".75"/><circle cx="1010" cy="920" r="1.1" opacity=".6"/>
  </g>
  <!-- sao đậm dọc ngân hà -->
  <g fill="#fff3d6">
    <circle cx="330" cy="820" r="1.5" opacity=".9"/><circle cx="450" cy="760" r="1.3" opacity=".85"/>
    <circle cx="560" cy="700" r="1.6" opacity=".9"/><circle cx="680" cy="640" r="1.3" opacity=".85"/>
    <circle cx="800" cy="580" r="1.5" opacity=".9"/><circle cx="930" cy="520" r="1.3" opacity=".85"/>
    <circle cx="1050" cy="520" r="1.5" opacity=".9"/><circle cx="1170" cy="460" r="1.3" opacity=".85"/>
