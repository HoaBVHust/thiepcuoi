<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset=".45" stop-color="#161f38"/>
      <stop offset=".75" stop-color="#272c4e"/>
      <stop offset="1" stop-color="#3c3a5e"/>
    </linearGradient>
    <radialGradient id="mw" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fdf6e0" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#cbb9e8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#cbb9e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff7dd" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#ffe9b8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
    <filter id="b1" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="b2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="42"/></filter>
    <g id="spk"><path d="M0 -9 L1.7 -1.7 L9 0 L1.7 1.7 L0 9 L-1.7 1.7 L-9 0 L-1.7 -1.7 Z" fill="#fff6dd"/></g>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- ===== DẢI NGÂN HÀ chéo ===== -->
  <g transform="rotate(-26 800 520)">
    <ellipse cx="800" cy="500" rx="980" ry="150" fill="url(#mw)" filter="url(#b1)"/>
    <ellipse cx="800" cy="500" rx="620" ry="62" fill="#fff2d4" opacity=".14" filter="url(#b1)"/>
  </g>

  <!-- ===== TINH VÂN ===== -->
  <g filter="url(#b1)">
    <ellipse cx="1210" cy="250" rx="330" ry="200" fill="#8a6bb8" opacity=".5"/>
    <ellipse cx="1050" cy="380" rx="240" ry="150" fill="#b2689a" opacity=".34"/>
    <ellipse cx="310" cy="430" rx="280" ry="185" fill="#3f7f96" opacity=".42"/>
    <ellipse cx="480" cy="880" rx="520" ry="230" fill="#a9628d" opacity=".4"/>
    <ellipse cx="830" cy="600" rx="300" ry="150" fill="#d9a86a" opacity=".2"/>
    <ellipse cx="1420" cy="700" rx="300" ry="190" fill="#6a5aa8" opacity=".4"/>
  </g>
  <g filter="url(#b2)">
    <ellipse cx="1330" cy="330" rx="140" ry="90" fill="#e8b7c8" opacity=".3"/>
    <ellipse cx="420" cy="330" rx="130" ry="80" fill="#7fc4d8" opacity=".3"/>
    <ellipse cx="700" cy="180" rx="170" ry="80" fill="#9db4e8" opacity=".3"/>
  </g>

  <!-- ===== MẶT TRĂNG LƯỠI LIỀM ===== -->
  <circle cx="1385" cy="165" r="95" fill="url(#glow)"/>
  <path d="M 1402 116 A 44 44 0 1 0 1402 214 A 34 34 0 1 1 1402 116 Z" fill="#f6eed9" opacity=".95"/>
  <circle cx="1370" cy="140" r="1.6" fill="#fff" opacity=".7"/>

  <!-- ===== SAO ===== -->
  <g fill="#ffffff">
    <circle cx="86" cy="120" r="1.2" opacity=".8"/><circle cx="172" cy="86" r=".9" opacity=".6"/>
    <circle cx="252" cy="180" r="1.4" opacity=".8"/><circle cx="332" cy="96" r="1" opacity=".55"/>
    <circle cx="410" cy="220" r="1.2" opacity=".7"/><circle cx="488" cy="140" r=".9" opacity=".6"/>
