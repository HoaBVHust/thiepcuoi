    <circle cx="860" cy="660" r="1.2" opacity=".8"/><circle cx="1110" cy="560" r="1.2" opacity=".8"/>
  </g>
  <!-- sao nhấp nháy (SMIL — hoạt động khi trình duyệt cho phép) -->
  <g fill="#ffffff">
    <circle cx="500" cy="250" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="140" r="1.8"><animate attributeName="opacity" values="1;.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1330" cy="420" r="2.1"><animate attributeName="opacity" values=".3;1;.3" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="480" r="1.8"><animate attributeName="opacity" values=".9;.25;.9" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="620" r="1.9"><animate attributeName="opacity" values=".25;1;.25" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="860" r="2"><animate attributeName="opacity" values="1;.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1520" cy="480" r="1.7"><animate attributeName="opacity" values=".3;1;.3" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="90" r="1.8"><animate attributeName="opacity" values="1;.3;1" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ===== SAO LỚN PHÁT SÁNG ===== -->
  <g>
    <circle cx="250" cy="300" r="46" fill="url(#glow)"/><circle cx="250" cy="300" r="2.6" fill="#fff"/>
    <circle cx="1100" cy="380" r="52" fill="url(#glow)"/><circle cx="1100" cy="380" r="2.8" fill="#fff"/>
    <circle cx="620" cy="560" r="40" fill="url(#glow)"/><circle cx="620" cy="560" r="2.2" fill="#fff"/>
    <circle cx="1460" cy="640" r="44" fill="url(#glow)"/><circle cx="1460" cy="640" r="2.4" fill="#fff"/>
  </g>

  <!-- ===== SAO 4 CÁNH LỚN ===== -->
  <use href="#spk" x="0" y="0" transform="translate(180 150) scale(1.1)" opacity=".9">
    <animate attributeName="opacity" values=".4;1;.4" dur="4s" repeatCount="indefinite"/>
  </use>
  <use href="#spk" transform="translate(540 110) scale(.8)" opacity=".85">
    <animate attributeName="opacity" values="1;.3;1" dur="3.4s" repeatCount="indefinite"/>
  </use>
  <use href="#spk" transform="translate(1010 260) scale(1.2)" opacity=".9">
    <animate attributeName="opacity" values=".5;1;.5" dur="4.4s" repeatCount="indefinite"/>
  </use>
  <use href="#spk" transform="translate(1240 560) scale(.7)" opacity=".8">
    <animate attributeName="opacity" values="1;.35;1" dur="3.1s" repeatCount="indefinite"/>
  </use>
  <use href="#spk" transform="translate(90 620) scale(.9)" opacity=".8">
    <animate attributeName="opacity" values=".45;1;.45" dur="3.9s" repeatCount="indefinite"/>
  </use>
  <use href="#spk" transform="translate(1420 200) scale(.75)" opacity=".85">
    <animate attributeName="opacity" values=".35;1;.35" dur="3.6s" repeatCount="indefinite"/>
  </use>
  <use href="#spk" transform="translate(560 860) scale(.7)" opacity=".7"/>
  <use href="#spk" transform="translate(880 860) scale(.85)" opacity=".75">
    <animate attributeName="opacity" values=".4;1;.4" dur="4.2s" repeatCount="indefinite"/>
  </use>
</svg>
