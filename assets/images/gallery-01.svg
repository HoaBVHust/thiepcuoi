<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7ef"/><stop offset="1" stop-color="#fdf9f3"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="900" height="1100" fill="url(#bg)"/>
  <g filter="url(#soft)">
    <circle cx="180" cy="220" r="150" fill="#a9b79c" opacity=".45"/>
    <circle cx="760" cy="320" r="130" fill="#e9cec2" opacity=".6"/>
    <circle cx="700" cy="920" r="170" fill="#c9a86a" opacity=".28"/>
    <circle cx="140" cy="950" r="120" fill="#a9b79c" opacity=".35"/>
  </g>
  <!-- arch -->
  <path d="M250 940 L250 500 A200 200 0 0 1 650 500 L650 940" fill="none" stroke="#63785b" stroke-width="2.5"/>
  <path d="M225 940 L225 495 A225 225 0 0 1 675 495 L675 940" fill="none" stroke="#a9b79c" stroke-width="1.4" opacity=".7"/>
  <!-- hanging date -->
  <g font-family="Georgia,serif" fill="#40523b" text-anchor="middle">
    <line x1="330" y1="452" x2="330" y2="560" stroke="#a9b79c" stroke-width="1.2"/>
    <line x1="450" y1="420" x2="450" y2="560" stroke="#a9b79c" stroke-width="1.2"/>
    <line x1="570" y1="452" x2="570" y2="560" stroke="#a9b79c" stroke-width="1.2"/>
    <text x="330" y="625" font-size="72">29</text>
    <text x="450" y="618" font-size="44" fill="#c9a86a">•</text>
    <text x="570" y="625" font-size="72">11</text>
    <text x="450" y="710" font-size="34" letter-spacing="10">2026</text>
  </g>
  <!-- floral clusters on arch -->
  <g filter="url(#soft2)">
    <circle cx="262" cy="560" r="16" fill="#e9cec2" opacity=".8"/>
    <circle cx="240" cy="700" r="12" fill="#c9a86a" opacity=".6"/>
    <circle cx="648" cy="640" r="14" fill="#e9cec2" opacity=".8"/>
  </g>
  <g>
    <g fill="#63785b">
      <ellipse cx="300" cy="380" rx="26" ry="10" transform="rotate(-38 300 380)"/>
      <ellipse cx="255" cy="420" rx="26" ry="10" transform="rotate(-65 255 420)"/>
      <ellipse cx="600" cy="380" rx="26" ry="10" transform="rotate(38 600 380)"/>
      <ellipse cx="645" cy="420" rx="26" ry="10" transform="rotate(38 645 420)"/>
      <ellipse cx="450" cy="322" rx="30" ry="11" transform="rotate(-4 450 322)"/>
    </g>
    <g>
      <circle cx="272" cy="400" r="17" fill="#e9cec2"/><circle cx="272" cy="400" r="7" fill="#c9a86a"/>
      <circle cx="238" cy="452" r="13" fill="#fdf9f3" stroke="#a9b79c" stroke-width="2"/>
      <circle cx="628" cy="400" r="17" fill="#e9cec2"/><circle cx="628" cy="400" r="7" fill="#c9a86a"/>
      <circle cx="662" cy="452" r="13" fill="#fdf9f3" stroke="#a9b79c" stroke-width="2"/>
      <circle cx="414" cy="342" r="15" fill="#c9a86a" opacity=".85"/>
      <circle cx="486" cy="342" r="15" fill="#e9cec2"/>
      <circle cx="450" cy="330" r="12" fill="#fdf9f3" stroke="#c9a86a" stroke-width="2"/>
    </g>
  </g>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#8c9188">
    <text x="450" y="995" font-size="17" letter-spacing="7">HOÀI AN &amp; BÙI HÒA</text>
    <text x="450" y="1030" font-size="12" letter-spacing="5" fill="#a9b79c">MỘT NGÀY ĐỂ NHỚ</text>
  </g>
</svg>
