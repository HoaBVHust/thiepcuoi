      <stop offset="0" stop-color="#eef2e8"/><stop offset="1" stop-color="#fdf9f3"/>
    </linearGradient>
    <filter id="gsoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="45"/></filter>
  </defs>
  <rect width="700" height="1050" fill="url(#gbg)"/>
