<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf3ee"/><stop offset="1" stop-color="#f4f7ef"/>
    </linearGradient>
    <filter id="softg" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg7)"/>
  <g filter="url(#softg)">
    <circle cx="200" cy="700" r="160" fill="#e9cec2" opacity=".55"/>
    <circle cx="1020" cy="220" r="150" fill="#a9b79c" opacity=".4"/>
    <circle cx="180" cy="180" r="110" fill="#c9a86a" opacity=".28"/>
  </g>
  <!-- table setting: plate + cutlery -->
  <g>
    <circle cx="600" cy="450" r="170" fill="#fffdf9" stroke="#a9b79c" stroke-width="2.5"/>
    <circle cx="600" cy="450" r="140" fill="none" stroke="#e9cec2" stroke-width="2"/>
    <g fill="#e9cec2">
      <ellipse cx="540" cy="420" rx="20" ry="8" transform="rotate(-25 540 420)"/>
      <ellipse cx="650" cy="470" rx="20" ry="8" transform="rotate(20 650 470)"/>
      <ellipse cx="630" cy="410" rx="14" ry="6" transform="rotate(15 630 410)" fill="#c9a86a" opacity=".8"/>
    </g>
  </g>
  <g stroke="#8c9188" stroke-width="6" stroke-linecap="round">
    <path d="M370 320 v260 M350 320 v70 M390 320 v70"/>
    <path d="M830 320 v260 M816 320 v90 M844 320 v90 M830 500 v80"/>
  </g>
  <!-- menu card -->
  <g transform="translate(920 560) rotate(8)">
    <rect x="-90" y="-120" width="180" height="240" rx="8" fill="#fffdf9" stroke="#a9b79c" stroke-width="2"/>
    <text x="0" y="-72" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#40523b">Menu</text>
    <path d="M-60 -50 h120 M-60 -18 h120 M-60 14 h120 M-60 46 h80" stroke="#d9ddd2" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="88" r="10" fill="#c9a86a"/>
  </g>
  <!-- candles -->
  <g>
    <rect x="300" y="560" width="44" height="120" rx="6" fill="#fdf9f3" stroke="#a9b79c" stroke-width="2"/>
    <rect x="380" y="610" width="36" height="80" rx="6" fill="#fdf9f3" stroke="#a9b79c" stroke-width="2"/>
    <g filter="url(#softg)"><circle cx="322" cy="540" r="14" fill="#c9a86a"/><circle cx="398" cy="592" r="11" fill="#c9a86a"/></g>
    <ellipse cx="322" cy="540" rx="6" ry="12" fill="#c9a86a"/>
    <ellipse cx="398" cy="592" rx="5" ry="10" fill="#c9a86a"/>
  </g>
  <!-- eucalyptus garland -->
  <g stroke="#63785b" stroke-width="2" fill="none">
    <path d="M120 480 C 220 440, 300 470, 360 520"/>
  </g>
  <g fill="#a9b79c">
    <ellipse cx="160" cy="464" rx="16" ry="7" transform="rotate(-18 160 464)"/>
    <ellipse cx="220" cy="452" rx="16" ry="7" transform="rotate(-10 220 452)"/>
    <ellipse cx="285" cy="462" rx="16" ry="7" transform="rotate(-4 285 462)"/>
    <ellipse cx="340" cy="486" rx="16" ry="7" transform="rotate(8 340 486)"/>
  </g>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <text x="600" y="820" font-size="13" letter-spacing="6" fill="#8c9188">TIỆC MỪNG NGÀY MỚI</text>
  </g>
</svg>
