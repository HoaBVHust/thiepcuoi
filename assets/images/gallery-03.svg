      <circle r="11" fill="#c9a86a"/>
    </g>
    <g transform="translate(548 470)">
      <g fill="#fdf9f3" stroke="#a9b79c" stroke-width="2.5"><circle cx="0" cy="-24" r="17"/><circle cx="23" cy="-7" r="17"/><circle cx="14" cy="19" r="17"/><circle cx="-14" cy="19" r="17"/><circle cx="-23" cy="-7" r="17"/></g>
