      <stop offset="0" stop-color="#fbf3ee"/><stop offset="1" stop-color="#fdf9f3"/>
    </linearGradient>
    <filter id="softc" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="50"/></filter>
  </defs>
  <rect width="900" height="1100" fill="url(#bg3)"/>
